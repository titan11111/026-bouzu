<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>僧侶の相談ゲーム - 悟りの道 -</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&family=Yuji+Syuku&display=swap" rel="stylesheet">
    <style>
        /* --- わびさび色設定（素朴・質素・20%くすみ増） --- */
        :root {
            --font-title: 'Yuji Syuku', serif;
            --font-body: 'Shippori Mincho', serif;
            --bg-color: #d9cfc0;
            --text-color: #5a524a;
            --accent-color: #9b8770;
            --success-color: #7a9e8f;
            --shadow-color: rgba(65, 61, 56, 0.12);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-color);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
            position: fixed;
            inset: 0;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            background-image: url('haikeibutu.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .container {
            max-width: 920px;
            width: 100%;
            height: min(720px, calc(100dvh - 16px));
            background: rgba(250, 248, 245, 0.96);
            padding: clamp(12px, 2.5vh, 24px);
            border-radius: 2px;
            box-shadow: 0 10px 40px rgba(27, 22, 16, 0.24);
            border: 1px solid #9b8a73;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            grid-template-columns: 1fr;
            gap: clamp(8px, 1.5vh, 14px);
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(139, 111, 71, 0.22);
            pointer-events: none;
        }

        header {
            text-align: center;
            border-bottom: 1px solid #d4c9bf;
            margin: 0;
            padding: 0 52px clamp(8px, 1.2vh, 13px);
            position: relative;
        }

        header h1 {
            font-family: var(--font-title);
            font-size: clamp(1.35rem, 4vw, 2rem);
            margin: 0;
            color: var(--accent-color);
            text-shadow: none;
            line-height: 1.3;
            font-weight: normal;
        }

        header p {
            margin: 3px 0 0;
            font-size: clamp(0.72rem, 2vw, 0.88rem);
            opacity: 0.75;
            font-weight: normal;
        }

        /* 音量ボタン */
        .sound-control {
            position: absolute;
            top: 0;
            right: 0;
            background: transparent;
            border: 1px solid var(--text-color);
            border-radius: 0;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s ease, background 0.08s ease;
            z-index: 10;
        }
        .sound-control:active {
            background: #d9cfc0;
            transform: scale(0.92);
        }

        .game-area {
            width: min(100%, 860px);
            height: 100%;
            min-height: 0;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(150px, 0.85fr);
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: clamp(8px, 1.5vh, 14px);
            align-content: stretch;
        }

        .monk-container {
            grid-column: 1;
            grid-row: 1;
            text-align: center;
            margin-bottom: 0;
            min-height: 0;
            position: relative;
        }

        .monk-container::before,
        .monk-container::after {
            display: none;
        }

        .monk-caption {
            display: none;
        }

        .monk-img {
            display: block;
            width: 100%;
            max-width: none;
            height: clamp(150px, 24vh, 220px);
            border-radius: 0;
            border: 1px solid var(--text-color);
            box-shadow: none;
            background: #fff;
            object-fit: cover;
            object-position: center 43%;
        }

        /* 相談カード */
        .consultation-card {
            grid-column: 1;
            grid-row: 2;
            background: #faf8f5;
            border: 1px solid #b9aa97;
            border-radius: 0;
            padding: clamp(14px, 2vh, 20px);
            position: relative;
            margin-top: 0;
            box-shadow: none;
        }

        .consultation-card::after {
            content: "問";
            position: absolute;
            top: -14px;
            left: 20px;
            background: var(--text-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 0;
            font-family: var(--font-title);
            font-size: 0.9rem;
            font-weight: normal;
        }

        .visitor-info {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 14px;
            border-bottom: 1px dotted #d4c9bf;
            margin-bottom: 8px;
            padding-bottom: 7px;
        }

        .visitor-name {
            font-weight: normal;
            font-size: 1rem;
            color: var(--accent-color);
        }

        .count-display {
            font-size: 0.85em;
            color: #888;
            font-family: var(--font-title);
            background: #eee6dc;
            padding: 2px 8px;
            border: 1px solid #d4c9bf;
            border-radius: 999px;
        }

        .consultation-text {
            font-size: clamp(0.88rem, 2.4vw, 1rem);
            line-height: 1.55;
            min-height: 2.8em;
            color: var(--text-color);
        }

        .soul-radar {
            grid-column: 2;
            grid-row: 1 / span 2;
            min-height: 0;
            padding: 12px 8px 8px;
            background: rgba(238, 232, 222, 0.72);
            border: 1px solid #b9aa97;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .soul-radar-title {
            font-family: var(--font-title);
            font-size: 0.65rem;
            color: #6e5b42;
            line-height: 1;
        }

        .soul-radar svg {
            display: block;
            width: 100%;
            height: min(24vh, 190px);
            overflow: visible;
        }

        .radar-grid, .radar-axis {
            fill: none;
            stroke: #b9aa97;
            stroke-width: 0.8;
        }

        .radar-shape {
            fill: rgba(139, 111, 71, 0.32);
            stroke: var(--accent-color);
            stroke-width: 2;
            transition: points 0.22s ease, opacity 0.18s ease;
        }

        .soul-radar.is-changing .radar-shape { opacity: 0.55; }

        .radar-label {
            fill: var(--text-color);
            font-family: var(--font-title);
            font-size: 8px;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .soul-balance {
            margin-top: -2px;
            font-size: 0.56rem;
            color: #766b5e;
        }

        /* ボタン */
        .advice-buttons {
            grid-column: 1 / -1;
            grid-row: 3;
            display: grid;
            grid-template-rows: repeat(3, minmax(48px, 1fr));
            gap: clamp(7px, 1.2vh, 11px);
            min-height: 0;
        }

        .advice-btn, .next-btn, .start-btn {
            font-family: var(--font-body);
            background: #faf8f5;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            border-radius: 0;
            min-height: 48px;
            padding: 10px 18px 10px 40px;
            font-size: clamp(0.82rem, 2.2vw, 0.95rem);
            font-weight: normal;
            cursor: pointer;
            position: relative;
            text-align: left;
            user-select: none;
            touch-action: manipulation;
            box-shadow: none;
            transform: translateY(0);
            transition: transform 0.08s ease, background 0.08s ease, opacity 0.08s ease;
        }

        .advice-btn::before {
            content: "◆";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            font-size: 0.7em;
            transition: color 0.2s;
        }

        .advice-btn:active {
            transform: scale(0.97);
            background: #f0e8e0;
            opacity: 0.88;
        }

        @media (hover: hover) {
            .advice-btn:hover {
                background: #f5eee5;
            }
        }

        /* 結果表示 */
        .result {
            grid-column: 1 / -1;
            grid-row: 3;
            padding: clamp(14px, 2vh, 20px);
            border: 1px solid #d4c9bf;
            border-radius: 0;
            background: #faf8f5;
            display: block;
            animation: fadeIn 0.4s ease;
            margin-top: 0;
            align-self: stretch;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result.hidden {
            display: none !important;
        }

        .result.success {
            border-color: var(--success-color);
            background: #f0f5f2;
        }

        .result-text {
            font-family: var(--font-title);
            font-size: 1.2em;
            margin-bottom: 10px;
            color: var(--accent-color);
            font-weight: normal;
        }

        .result.success .result-text {
            color: var(--success-color);
        }

        /* 次へボタン */
        .next-btn {
            margin-top: 16px;
            text-align: center;
            background: var(--text-color);
            color: #fff;
            padding: 12px;
            width: 100%;
            box-shadow: none;
        }
        .next-btn:active {
            background: #5a5450;
        }

        .ending-panel {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            width: 100%;
            text-align: center;
            padding: 2px 14px;
            animation: fadeIn 0.4s ease;
            align-self: start;
        }

        .ending-radar {
            grid-column: auto;
            grid-row: auto;
            width: min(350px, 72vw);
            min-height: 0;
            margin: 4px auto;
            padding: 6px;
        }

        .ending-radar svg { height: min(22vh, 190px); }
        .ending-radar .soul-radar-title { font-size: 0.9rem; }
        .ending-radar .soul-balance { font-size: 0.72rem; }
        .ending-panel .next-btn { margin-top: 5px; }

        /* スタート画面 */
        #start-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .start-content {
            background: #faf8f5;
            padding: 40px 30px;
            text-align: center;
            border-radius: 0;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            border: 1px solid #d4c9bf;
        }
        .start-btn {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: none;
            width: 100%;
            text-align: center;
            padding: 14px;
            margin-top: 24px;
            font-weight: normal;
        }
        .start-btn:active {
            background: #7a5f3f;
        }

        /* スマホ対応 */
        @media (max-width: 768px) {
            body {
                padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
            }

            .container {
                height: 100%;
                gap: 7px;
                padding: 10px;
            }

            header h1 {
                font-size: clamp(1.16rem, 5.2vw, 1.45rem);
            }

            .sound-control {
                width: 42px;
                height: 42px;
                font-size: 0.9em;
                top: -3px;
                right: 0;
            }

            .monk-img {
                width: 100%;
                max-width: none;
                height: clamp(126px, 20vh, 170px);
            }

            .monk-caption {
                font-size: 0.6rem;
            }

            .advice-btn {
                padding: 8px 10px 8px 32px;
            }

            .consultation-card {
                padding: 12px 11px 10px;
            }

            .game-area { grid-template-columns: minmax(0, 1fr) 118px; }
            .soul-radar { padding: 7px 4px 5px; }
            .soul-radar svg { height: min(18vh, 130px); }
        }

        /* スマホは「縦に読む」ことを優先。横並びで窮屈にしない。 */
        @media (max-width: 600px) {
            html, body {
                height: auto;
                min-height: 100%;
                overflow-x: hidden;
            }

            body {
                position: static;
                display: block;
                padding: 0;
                background: var(--bg-color);
            }

            body::before { background-position: center top; }

            .container {
                width: 100%;
                min-height: 100dvh;
                height: auto;
                padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
                border: 0;
                border-radius: 0;
                box-shadow: none;
                gap: 12px;
                background: rgba(250, 248, 245, 0.94);
            }

            .container::before { inset: 6px; }

            header {
                padding: 2px 48px 10px;
            }

            header h1 { font-size: 1.35rem; }
            header p { font-size: 0.72rem; }

            .game-area {
                width: 100%;
                height: auto;
                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto auto;
                gap: 12px;
            }

            .monk-container,
            .consultation-card,
            .soul-radar,
            .advice-buttons,
            .result {
                grid-column: 1;
                grid-row: auto;
            }

            .monk-img {
                width: 100%;
                height: clamp(150px, 26dvh, 220px);
                border-radius: 16px;
                border-color: rgba(90, 82, 74, 0.72);
                box-shadow: 0 12px 22px rgba(56, 44, 30, 0.16);
                object-position: center 42%;
            }

            .consultation-card {
                padding: 18px 16px 14px;
                border-radius: 14px;
                box-shadow: 0 5px 14px rgba(56, 44, 30, 0.08);
            }

            .consultation-card::after {
                top: -13px;
                left: 16px;
                border-radius: 999px;
            }

            .visitor-info { justify-content: space-between; }
            .consultation-text { font-size: 0.98rem; line-height: 1.7; }

            .soul-radar {
                padding: 10px 14px 8px;
                border-radius: 14px;
                display: grid;
                grid-template-columns: 1fr auto;
                grid-template-rows: auto auto;
                align-items: center;
                text-align: left;
            }

            .soul-radar-title { font-size: 0.82rem; }
            .soul-radar svg {
                grid-column: 2;
                grid-row: 1 / span 2;
                width: 116px;
                height: 104px;
            }
            .soul-balance { margin: 4px 0 0; font-size: 0.75rem; }

            .advice-buttons {
                grid-template-rows: repeat(3, minmax(58px, auto));
                gap: 10px;
            }

            .advice-btn {
                min-height: 58px;
                padding: 11px 14px 11px 38px;
                border-radius: 12px;
                font-size: 0.94rem;
                line-height: 1.45;
                box-shadow: 0 3px 8px rgba(56, 44, 30, 0.08);
            }

            .advice-btn::before { left: 15px; }
            .result { border-radius: 14px; }
            .start-content { border-radius: 18px; padding: 34px 24px; }
            .start-btn, .next-btn { border-radius: 12px; }
        }

        @media (max-width: 600px) and (max-height: 700px) {
            header p { display: block; }
            .monk-img { height: 142px; }
            .game-area { gap: 9px; }
            .consultation-card { padding: 15px 14px 11px; }
            .consultation-text { line-height: 1.5; }
            .soul-radar svg { width: 96px; height: 86px; }
            .advice-buttons { gap: 8px; }
            .advice-btn { min-height: 52px; }
        }

        @media (max-height: 700px) {
            header p { display: none; }
            .game-area { gap: 6px; }
            .monk-img { width: 100%; height: 115px; }
            .monk-caption { display: none; }
            .consultation-card { padding-top: 11px; padding-bottom: 8px; }
            .game-area { grid-template-columns: minmax(0, 1fr) 106px; }
            .soul-radar svg { height: 68px; }
            .consultation-text { line-height: 1.4; min-height: 2.6em; }
            .advice-buttons { gap: 6px; }
        }

        /* 低いスマホ画面では、上の共通コンパクト指定より縦1列を優先する。 */
        @media (max-width: 600px) and (max-height: 700px) {
            .game-area { grid-template-columns: 1fr; gap: 9px; }
            .monk-img { height: 142px; }
            .consultation-card { padding: 15px 14px 11px; }
            .consultation-text { line-height: 1.5; }
            .soul-radar svg { width: 96px; height: 86px; }
            .advice-buttons { gap: 8px; }
            .advice-btn { min-height: 52px; }
        }

        /* スマホはスクロールなしの1画面完結。上段だけ横並びにして情報密度を保つ。 */
        @media (max-width: 600px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }

            body {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 6px;
            }

            .container {
                height: calc(100dvh - 12px);
                min-height: 0;
                padding: 10px;
                overflow: hidden;
                grid-template-rows: auto minmax(0, 1fr);
                gap: 8px;
            }

            header {
                padding: 0 46px 7px;
            }

            header h1 { font-size: 1.22rem; }
            header p { display: none; }
            .sound-control { top: -2px; }

            .game-area {
                height: 100%;
                min-height: 0;
                grid-template-columns: minmax(0, 1fr) 108px;
                grid-template-rows: minmax(128px, 23dvh) auto minmax(0, 1fr);
                gap: 8px;
            }

            .monk-container {
                grid-column: 1;
                grid-row: 1;
            }

            .monk-img {
                height: 100%;
                min-height: 0;
                border-radius: 12px;
                box-shadow: 0 7px 16px rgba(56, 44, 30, 0.14);
            }

            .consultation-card {
                grid-column: 1 / -1;
                grid-row: 2;
                padding: 13px 14px 10px;
                border-radius: 12px;
            }

            .consultation-text {
                font-size: clamp(0.82rem, 3.6vw, 0.96rem);
                line-height: 1.45;
                min-height: 2.5em;
            }

            .soul-radar {
                grid-column: 2;
                grid-row: 1;
                min-height: 0;
                padding: 8px 4px 5px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }

            .soul-radar-title { font-size: 0.62rem; }
            .soul-radar svg {
                display: block;
                width: 100%;
                height: min(15dvh, 104px);
                grid-column: auto;
                grid-row: auto;
            }
            .soul-balance { margin: -2px 0 0; font-size: 0.55rem; }

            .advice-buttons,
            .result {
                grid-column: 1 / -1;
                grid-row: 3;
                min-height: 0;
            }

            .advice-buttons {
                grid-template-rows: repeat(3, minmax(48px, 1fr));
                gap: 8px;
            }

            .advice-btn {
                min-height: 0;
                padding: 8px 12px 8px 36px;
                border-radius: 10px;
                font-size: clamp(0.78rem, 3.35vw, 0.92rem);
                line-height: 1.35;
            }

            .advice-btn::before { left: 13px; }
            .result { padding: 13px; border-radius: 12px; overflow: auto; }
        }

        @media (max-width: 600px) and (max-height: 620px) {
            .container { padding: 8px; gap: 6px; }
            header { padding-bottom: 4px; }
            header h1 { font-size: 1.1rem; }
            .game-area {
                grid-template-rows: minmax(106px, 20dvh) auto minmax(0, 1fr);
                gap: 6px;
            }
            .consultation-card { padding: 10px 12px 7px; }
            .visitor-info { margin-bottom: 5px; padding-bottom: 4px; }
            .consultation-text { font-size: 0.8rem; line-height: 1.35; }
            .soul-radar svg { height: min(13dvh, 76px); }
            .advice-buttons { gap: 6px; }
        }
    </style>
    <meta property="og:title" content="僧侶の相談ゲーム - 悟りの道 -">
    <meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">

    <meta property="og:type" content="website">

</head>
<body>
    <audio id="bgm" loop preload="none">
        <source src="audio/Whispers%20of%20the%20Stillness.mp3" type="audio/mpeg">
    </audio>

    <div id="start-overlay">
        <div class="start-content">
            <h1 style="font-family: var(--font-title); margin-bottom: 20px; color: var(--accent-color); font-size: 1.8em;">僧侶の相談部屋</h1>
            <p style="line-height: 1.8; font-weight: normal;">心を落ち着け、<br>迷える者たちを導くのです。<br>（全10問の修行となります）</p>
            <button class="start-btn" id="start-btn">修行開始</button>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>🙏 僧侶の相談部屋 🙏</h1>

            }).join(' ');
            const polygon = document.getElementById('soul-polygon');
            const radar = document.getElementById('soul-radar');
            if (!polygon || !radar) return;
            polygon.setAttribute('points', points);
            document.getElementById('soul-balance').textContent =
                `善 ${stats.toku + stats.satori + stats.nin}｜業 ${stats.ton + stats.jin + stats.chi}`;
            radar.classList.remove('is-changing');
            requestAnimationFrame(() => radar.classList.add('is-changing'));
            window.setTimeout(() => radar.classList.remove('is-changing'), 260);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showConsultation() {
            if (playCount >= MAX_PLAY_COUNT) {
                endGame();
                return;
            }

            let randomIndex;

            // 2回目シナリオ出現ロジック（同一相談者の連続を避ける）
            if (currentScenario === 2 && Math.random() < 0.4 && succeedIndices.length > 0) {
                // 正解した相談者の中からランダムに選出（前回の相談者は除外）
                const availableSucceed = succeedIndices.filter(idx => idx !== lastCorrectConsultantIndex);
                if (availableSucceed.length > 0) {
                    randomIndex = availableSucceed[Math.floor(Math.random() * availableSucceed.length)];
                } else {
                    // 避けられない場合は新しい相談者を選出
                    do {
                        randomIndex = Math.floor(Math.random() * consultations.length);
                    } while (usedIndices.includes(randomIndex) || randomIndex === lastCorrectConsultantIndex);
                }
                usedIndexes_scenario2.push(randomIndex);
            } else {
                // 1回目: 新しい相談者をランダムに選出
                do {
                    randomIndex = Math.floor(Math.random() * consultations.length);
                } while (usedIndices.includes(randomIndex) || randomIndex === lastCorrectConsultantIndex);
                usedIndices.push(randomIndex);
                currentScenario = 1;
            }

            currentData = consultations[randomIndex];

            document.getElementById('visitor-name').textContent = currentData.name;
            document.getElementById('consultation-text').textContent = currentScenario === 1 ? currentData.problem : currentData.problem_2;
            document.getElementById('count-display').textContent = `${playCount + 1} / ${MAX_PLAY_COUNT}`;

            const btnArea = document.getElementById('advice-buttons');
            btnArea.replaceChildren();

            let advice = currentScenario === 1 ? currentData.advice : currentData.advice_2;
            let choices = advice.map((text, index) => {
                return { text: text, originalIndex: index };
            });
            choices = shuffleArray(choices);

            choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'advice-btn';
                btn.textContent = choice.text;
                bindTap(btn, () => checkAnswer(choice.originalIndex));
                btnArea.appendChild(btn);
            });

            const resultDiv = document.getElementById('result');
            resultDiv.classList.add('hidden');
            resultDiv.className = 'result hidden';
            btnArea.style.display = 'grid';
        }

        function checkAnswer(originalIndex) {
            const correct = currentScenario === 1 ? currentData.correct : currentData.correct_2;
            const isCorrect = (originalIndex === correct);
            const resultDiv = document.getElementById('result');

            document.getElementById('advice-buttons').style.display = 'none';
            resultDiv.classList.remove('hidden');

            if (isCorrect) {
                resultDiv.className = 'result success';
                document.getElementById('result-text').textContent = '見事！ 徳が高まりました';
                const msg = currentScenario === 1 ? currentData.message : currentData.message_2;
                document.getElementById('result-message').textContent = msg;
                updateStats(5, 5, 5, -5, -5, -5);

                // 正解時は、この相談者を記録
                const currentIndex = usedIndices[usedIndices.length - 1];
                lastCorrectConsultantIndex = currentIndex;

                // 1回目で正解した場合、その相談者を記録
                if (currentScenario === 1) {
                    if (!succeedIndices.includes(currentIndex)) {
                        succeedIndices.push(currentIndex);
                    }
                }
            } else {
                resultDiv.className = 'result failure';
                document.getElementById('result-text').textContent = '喝！ 煩悩にまみれております';
                const msg = currentScenario === 1 ? currentData.failMessage : currentData.failMessage_2;
                document.getElementById('result-message').textContent = msg;

                const poisonType = Math.floor(Math.random() * 3);
                let dTon = 0, dJin = 0, dChi = 0;
                if(poisonType === 0) dTon = 15;
                if(poisonType === 1) dJin = 15;
                if(poisonType === 2) dChi = 15;

                updateStats(-2, -2, -2, dTon, dJin, dChi);
            }
        }

        function updateStats(dToku, dSatori, dNin, dTon, dJin, dChi) {
            stats.toku = clamp(stats.toku + dToku);
            stats.satori = clamp(stats.satori + dSatori);
            stats.nin = clamp(stats.nin + dNin);
            stats.ton = clamp(stats.ton + dTon);
            stats.jin = clamp(stats.jin + dJin);
            stats.chi = clamp(stats.chi + dChi);

            updateSoulStatus();
        }

        function clamp(val) {
            return Math.max(0, Math.min(100, val));
        }

        function nextConsultation() {
            playCount++;
            showConsultation();
        }

        function endGame() {
            let sumGood = stats.toku + stats.satori + stats.nin;
            let sumBad = stats.ton + stats.jin + stats.chi;
            let diff = sumGood - sumBad;

            let rankTitle = "";
            let rankMsg = "";
            let rankClass = "success";

            if (diff >= 200) {
                rankTitle = "【 修行の最高峰：大悟 】";
                rankMsg = "十の問いを越え、迷いを導く境地へ至りました。修行の最高峰です。";
            } else if (diff >= 150) {
                rankTitle = "【 悟者：多くが心に映る 】";
                rankMsg = "教えを伝え、人の心を見抜く力があります。あと一歩で大悟です。";
            } else if (diff >= 100) {
                rankTitle = "【 心の師：人を導ける 】";
                rankMsg = "迷える者を受け止められる落ち着きと知恵があります。";
            } else if (diff >= 50) {
                rankTitle = "【 修行の達人：知識と実践 】";
                rankMsg = "修行の道をよくわきまえ、その実践がかなっています。立派な力量です。";
            } else if (diff >= 0) {
                rankTitle = "【 修行者：励む身 】";
                rankMsg = "修行に励み、日々心を磨いています。穏やかな心が育っています。";
            } else if (diff >= -50) {
                rankTitle = "【 修行中：精一杯 】";
                rankMsg = "日々の修行で精一杯です。答えはまだ先にあります。諦めずに進みなさい。";
                rankClass = "failure";
            } else if (diff >= -100) {
                rankTitle = "【 修行の迷い：正しさを見失う 】";
                rankMsg = "何が正しいのか見失っています。しかし迷っているうちはまだ希望があります。";
                rankClass = "failure";
            } else if (diff >= -150) {
                rankTitle = "【 怠け坊主：修行放棄 】";
                rankMsg = "修行をさぼってばかりいます。まずは起床から始めましょう。";
                rankClass = "failure";
            } else if (diff >= -200) {
                rankTitle = "【 生臭坊主：欲に塗れた身 】";
                rankMsg = "欲にまみれ、本来の修行道を忘れています。袈裟の重みを感じなさい。";
                rankClass = "failure";
            } else {
                rankTitle = "【 破戒坊主：戒律崩壊 】";
                rankMsg = "すべての戒律を破った存在です。喝！ 一から修行を始めなされ。";
                rankClass = "failure";
            }

            const resultColor = (rankClass === 'success') ? 'var(--success-color)' : 'var(--accent-color)';
            const finalRadar = document.getElementById('soul-radar').cloneNode(true);
            finalRadar.id = 'final-soul-radar';
            finalRadar.classList.add('ending-radar');
            const panel = document.createElement('div');
            panel.className = 'ending-panel';

            const title = document.createElement('h2');
            title.textContent = '～ 修行終了 ～';
            title.style.cssText = `font-family:var(--font-title);color:${resultColor};font-size:1.5em;margin:0 0 8px;font-weight:normal`;

            const rank = document.createElement('h3');
            rank.textContent = rankTitle;
            rank.style.cssText = `font-size:1.1em;margin:0 0 12px;color:${resultColor};border-bottom:1px solid ${resultColor};display:inline-block;padding-bottom:4px;font-weight:normal`;

            const message = document.createElement('p');
            message.textContent = rankMsg;
            message.style.cssText = 'font-size:.95em;margin:5px 0;line-height:1.5';

            const score = document.createElement('div');
            score.style.cssText = 'background:#f0e8e0;padding:6px;margin:5px 0';
            [
                `善行値：${sumGood}`,
                `煩悩値：${sumBad}`,
                `心の差し引き：${diff}`
            ].forEach((text) => {
                const row = document.createElement('p');
                row.textContent = text;
                row.style.cssText = 'margin:3px 0';
                score.appendChild(row);
            });

            const restart = document.createElement('button');
            restart.className = 'next-btn';
            restart.textContent = 'もう一度修行する';
            bindTap(restart, () => location.reload());

            const note = document.createElement('small');
            note.textContent = '※僧階はこのゲーム独自の修行段階です';

            panel.append(title, rank, finalRadar, message, score, note, restart);
            document.querySelector('.game-area').replaceChildren(panel);
        }
    </script>
</body>
